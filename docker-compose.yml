services:
  mysql:
    image: mysql:8.4
    container_name: lifely-mysql
    profiles: ["Laravel", "Both"]
    restart: unless-stopped
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    environment:
      MYSQL_DATABASE: "${MYSQL_DATABASE:-lifely}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-secret}"
    volumes:
      - lifely_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  postgresql:
    image: postgres:16-alpine
    container_name: lifely-postgresql
    profiles: ["Nest", "Both"]
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: "${POSTGRES_DATABASE:-lifely_nestjs}"
      POSTGRES_USER: "${POSTGRES_USER:-lifely}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-secret}"
    volumes:
      - lifely_postgresql_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  phpmyadmin:
    image: phpmyadmin:5-apache
    container_name: lifely-phpmyadmin
    profiles: ["Laravel", "Both"]
    restart: unless-stopped
    ports:
      - "${PHPMYADMIN_PORT:-8080}:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: "${MYSQL_ROOT_PASSWORD:-secret}"
      UPLOAD_LIMIT: 64M
    depends_on:
      mysql:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: lifely-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - lifely_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    container_name: lifely-mailpit
    profiles: ["Laravel", "Both"]
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_HTTP_PORT:-8025}:8025"

  backend-laravel:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: lifely-backend-laravel
    profiles: ["Laravel", "Both"]
    restart: unless-stopped
    ports:
      - "${BACKEND_LARAVEL_PORT:-8000}:8000"
    volumes:
      - ./backend-laravel:/var/www/html
      - ./docker/backend/xdebug.ini:/usr/local/etc/php/conf.d/99-xdebug.ini:ro
      - lifely_backend_vendor:/var/www/html/vendor
      - lifely_backend_bootstrap_cache:/var/www/html/bootstrap/cache
    environment:
      APP_NAME: Lifely
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: "http://localhost:${BACKEND_LARAVEL_PORT:-8000}"
      FRONTEND_URL: "http://localhost:${FRONTEND_PORT:-5173}"
      SANCTUM_STATEFUL_DOMAINS: "localhost:${FRONTEND_PORT:-5173},127.0.0.1:${FRONTEND_PORT:-5173}"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: "${MYSQL_DATABASE:-lifely}"
      DB_USERNAME: root
      DB_PASSWORD: "${MYSQL_ROOT_PASSWORD:-secret}"
      SESSION_DRIVER: file
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      MAIL_MAILER: "${MAIL_MAILER:-smtp}"
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_FROM_ADDRESS: "${MAIL_FROM_ADDRESS:-hello@lifely.local}"
      MAIL_FROM_NAME: "${MAIL_FROM_NAME:-Lifely}"
      RESEND_API_KEY: "${RESEND_API_KEY:-}"
      LIFELY_EMAIL_SENDER: "${LIFELY_EMAIL_SENDER:-mail}"
      LIFELY_EMAIL_MAILER: "${LIFELY_EMAIL_MAILER:-}"
      LIFELY_APP_MODE: "${LIFELY_APP_MODE:-production}"
      LIFELY_DEMO_EMAIL_LIMIT: "${LIFELY_DEMO_EMAIL_LIMIT:-3}"
      LIFELY_ACCESS_TOKEN_MINUTES: 15
      LIFELY_REFRESH_TOKEN_DAYS: 30
      LIFELY_RUN_MIGRATIONS: "true"
      LIFELY_RUN_SEEDERS: "true"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started

  backend-laravel-queue:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: lifely-backend-laravel-queue
    profiles: ["Laravel", "Both"]
    restart: unless-stopped
    volumes:
      - ./backend-laravel:/var/www/html
      - ./docker/backend/xdebug.ini:/usr/local/etc/php/conf.d/99-xdebug.ini:ro
      - lifely_backend_vendor:/var/www/html/vendor
      - lifely_backend_bootstrap_cache:/var/www/html/bootstrap/cache
    environment:
      APP_NAME: Lifely
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: "http://localhost:${BACKEND_LARAVEL_PORT:-8000}"
      FRONTEND_URL: "http://localhost:${FRONTEND_PORT:-5173}"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: "${MYSQL_DATABASE:-lifely}"
      DB_USERNAME: root
      DB_PASSWORD: "${MYSQL_ROOT_PASSWORD:-secret}"
      SESSION_DRIVER: file
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      MAIL_MAILER: "${MAIL_MAILER:-smtp}"
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_FROM_ADDRESS: "${MAIL_FROM_ADDRESS:-hello@lifely.local}"
      MAIL_FROM_NAME: "${MAIL_FROM_NAME:-Lifely}"
      RESEND_API_KEY: "${RESEND_API_KEY:-}"
      LIFELY_EMAIL_SENDER: "${LIFELY_EMAIL_SENDER:-mail}"
      LIFELY_EMAIL_MAILER: "${LIFELY_EMAIL_MAILER:-}"
      LIFELY_APP_MODE: "${LIFELY_APP_MODE:-production}"
      LIFELY_DEMO_EMAIL_LIMIT: "${LIFELY_DEMO_EMAIL_LIMIT:-3}"
      LIFELY_ACCESS_TOKEN_MINUTES: 15
      LIFELY_REFRESH_TOKEN_DAYS: 30
      LIFELY_RUN_MIGRATIONS: "false"
      LIFELY_RUN_SEEDERS: "false"
    depends_on:
      backend-laravel:
        condition: service_started
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    command: php artisan queue:work --queue=emails,leads,default --tries=3 --timeout=90

  backend-laravel-scheduler:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: lifely-backend-laravel-scheduler
    profiles: ["Laravel", "Both"]
    restart: unless-stopped
    volumes:
      - ./backend-laravel:/var/www/html
      - ./docker/backend/xdebug.ini:/usr/local/etc/php/conf.d/99-xdebug.ini:ro
      - lifely_backend_vendor:/var/www/html/vendor
      - lifely_backend_bootstrap_cache:/var/www/html/bootstrap/cache
    environment:
      APP_NAME: Lifely
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: "http://localhost:${BACKEND_LARAVEL_PORT:-8000}"
      FRONTEND_URL: "http://localhost:${FRONTEND_PORT:-5173}"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: "${MYSQL_DATABASE:-lifely}"
      DB_USERNAME: root
      DB_PASSWORD: "${MYSQL_ROOT_PASSWORD:-secret}"
      SESSION_DRIVER: file
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      MAIL_MAILER: "${MAIL_MAILER:-smtp}"
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_FROM_ADDRESS: "${MAIL_FROM_ADDRESS:-hello@lifely.local}"
      MAIL_FROM_NAME: "${MAIL_FROM_NAME:-Lifely}"
      RESEND_API_KEY: "${RESEND_API_KEY:-}"
      LIFELY_EMAIL_SENDER: "${LIFELY_EMAIL_SENDER:-mail}"
      LIFELY_EMAIL_MAILER: "${LIFELY_EMAIL_MAILER:-}"
      LIFELY_APP_MODE: "${LIFELY_APP_MODE:-production}"
      LIFELY_DEMO_EMAIL_LIMIT: "${LIFELY_DEMO_EMAIL_LIMIT:-3}"
      LIFELY_ACCESS_TOKEN_MINUTES: 15
      LIFELY_REFRESH_TOKEN_DAYS: 30
      LIFELY_RUN_MIGRATIONS: "false"
      LIFELY_RUN_SEEDERS: "false"
    depends_on:
      backend-laravel:
        condition: service_started
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    command: php artisan schedule:work

  backend-nest:
    build:
      context: .
      dockerfile: docker/nestjs/Dockerfile
    container_name: lifely-backend-nest
    profiles: ["Nest", "Both"]
    restart: unless-stopped
    ports:
      - "${BACKEND_NESTJS_PORT:-3000}:3000"
      - "${NESTJS_DEBUG_PORT:-9229}:9229"
    volumes:
      - ./backend-nestjs:/app
      - lifely_nestjs_node_modules:/app/node_modules
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: "postgresql://${POSTGRES_USER:-lifely}:${POSTGRES_PASSWORD:-secret}@postgresql:5432/${POSTGRES_DATABASE:-lifely_nestjs}"
      DB_HOST: postgresql
      DB_PORT: 5432
      DB_DATABASE: "${POSTGRES_DATABASE:-lifely_nestjs}"
      DB_USERNAME: "${POSTGRES_USER:-lifely}"
      DB_PASSWORD: "${POSTGRES_PASSWORD:-secret}"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      FRONTEND_URL: "http://localhost:${FRONTEND_PORT:-5173}"
      LIFELY_QUEUE_ENABLED: "false"
      LIFELY_QUEUE_WORKER_ENABLED: "false"
      LIFELY_SCHEDULER_ENABLED: "false"
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy

  backend-nest-queue:
    build:
      context: .
      dockerfile: docker/nestjs/Dockerfile
    container_name: lifely-backend-nest-queue
    profiles: ["Nest", "Both"]
    restart: unless-stopped
    volumes:
      - ./backend-nestjs:/app
      - lifely_nestjs_node_modules:/app/node_modules
    environment:
      NODE_ENV: development
      DATABASE_URL: "postgresql://${POSTGRES_USER:-lifely}:${POSTGRES_PASSWORD:-secret}@postgresql:5432/${POSTGRES_DATABASE:-lifely_nestjs}"
      DB_HOST: postgresql
      DB_PORT: 5432
      DB_DATABASE: "${POSTGRES_DATABASE:-lifely_nestjs}"
      DB_USERNAME: "${POSTGRES_USER:-lifely}"
      DB_PASSWORD: "${POSTGRES_PASSWORD:-secret}"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      FRONTEND_URL: "http://localhost:${FRONTEND_PORT:-5173}"
      LIFELY_QUEUE_ENABLED: "true"
      LIFELY_QUEUE_WORKER_ENABLED: "true"
      LIFELY_SCHEDULER_ENABLED: "false"
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      backend-nest:
        condition: service_started
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: npm run start:background

  backend-nest-scheduler:
    build:
      context: .
      dockerfile: docker/nestjs/Dockerfile
    container_name: lifely-backend-nest-scheduler
    profiles: ["Nest", "Both"]
    restart: unless-stopped
    volumes:
      - ./backend-nestjs:/app
      - lifely_nestjs_node_modules:/app/node_modules
    environment:
      NODE_ENV: development
      DATABASE_URL: "postgresql://${POSTGRES_USER:-lifely}:${POSTGRES_PASSWORD:-secret}@postgresql:5432/${POSTGRES_DATABASE:-lifely_nestjs}"
      DB_HOST: postgresql
      DB_PORT: 5432
      DB_DATABASE: "${POSTGRES_DATABASE:-lifely_nestjs}"
      DB_USERNAME: "${POSTGRES_USER:-lifely}"
      DB_PASSWORD: "${POSTGRES_PASSWORD:-secret}"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      FRONTEND_URL: "http://localhost:${FRONTEND_PORT:-5173}"
      LIFELY_QUEUE_ENABLED: "true"
      LIFELY_QUEUE_WORKER_ENABLED: "false"
      LIFELY_SCHEDULER_ENABLED: "true"
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      backend-nest:
        condition: service_started
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: npm run start:background

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    container_name: lifely-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - lifely_frontend_node_modules:/app/node_modules
    environment:
      BACKEND_MODE: "${BACKEND_MODE:-Laravel}"
      BACKEND_LARAVEL_PORT: "${BACKEND_LARAVEL_PORT:-8000}"
      BACKEND_NESTJS_PORT: "${BACKEND_NESTJS_PORT:-3000}"
      CHOKIDAR_USEPOLLING: "true"
    command:
      - sh
      - -c
      - |
        if [ "$$BACKEND_MODE" = "Nest" ]; then
          export VITE_API_BASE_URL="http://localhost:$${BACKEND_NESTJS_PORT:-3000}/api/v1";
        else
          export VITE_API_BASE_URL="http://localhost:$${BACKEND_LARAVEL_PORT:-8000}/api/v1";
        fi
        npm run dev

volumes:
  lifely_mysql_data:
  lifely_postgresql_data:
  lifely_redis_data:
  lifely_backend_vendor:
  lifely_backend_bootstrap_cache:
  lifely_nestjs_node_modules:
  lifely_frontend_node_modules:
