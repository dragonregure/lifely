services:
  mysql:
    image: mysql:8.4
    container_name: lifely-mysql
    restart: unless-stopped
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    environment:
      MYSQL_DATABASE: "${MYSQL_DATABASE:-lifely}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-secret}"
    volumes:
      - lifely_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  phpmyadmin:
    image: phpmyadmin:5-apache
    container_name: lifely-phpmyadmin
    restart: unless-stopped
    ports:
      - "${PHPMYADMIN_PORT:-8080}:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: "${MYSQL_ROOT_PASSWORD:-secret}"
      UPLOAD_LIMIT: 64M
    depends_on:
      mysql:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: lifely-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - lifely_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    container_name: lifely-mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_HTTP_PORT:-8025}:8025"

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: lifely-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend-laravel:/var/www/html
      - ./docker/backend/xdebug.ini:/usr/local/etc/php/conf.d/99-xdebug.ini:ro
      - lifely_backend_vendor:/var/www/html/vendor
      - lifely_backend_bootstrap_cache:/var/www/html/bootstrap/cache
    environment:
      APP_NAME: Lifely
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: "http://localhost:${BACKEND_PORT:-8000}"
      FRONTEND_URL: "http://localhost:${FRONTEND_PORT:-5173}"
      SANCTUM_STATEFUL_DOMAINS: "localhost:${FRONTEND_PORT:-5173},127.0.0.1:${FRONTEND_PORT:-5173}"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: "${MYSQL_DATABASE:-lifely}"
      DB_USERNAME: root
      DB_PASSWORD: "${MYSQL_ROOT_PASSWORD:-secret}"
      SESSION_DRIVER: file
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_FROM_ADDRESS: "hello@lifely.local"
      MAIL_FROM_NAME: Lifely
      LIFELY_ACCESS_TOKEN_MINUTES: 15
      LIFELY_REFRESH_TOKEN_DAYS: 30
      LIFELY_RUN_MIGRATIONS: "true"
      LIFELY_RUN_SEEDERS: "true"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started

  queue:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: lifely-queue
    restart: unless-stopped
    volumes:
      - ./backend-laravel:/var/www/html
      - ./docker/backend/xdebug.ini:/usr/local/etc/php/conf.d/99-xdebug.ini:ro
      - lifely_backend_vendor:/var/www/html/vendor
      - lifely_backend_bootstrap_cache:/var/www/html/bootstrap/cache
    environment:
      APP_NAME: Lifely
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: "http://localhost:${BACKEND_PORT:-8000}"
      FRONTEND_URL: "http://localhost:${FRONTEND_PORT:-5173}"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: "${MYSQL_DATABASE:-lifely}"
      DB_USERNAME: root
      DB_PASSWORD: "${MYSQL_ROOT_PASSWORD:-secret}"
      SESSION_DRIVER: file
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_FROM_ADDRESS: "hello@lifely.local"
      MAIL_FROM_NAME: Lifely
      LIFELY_ACCESS_TOKEN_MINUTES: 15
      LIFELY_REFRESH_TOKEN_DAYS: 30
      LIFELY_RUN_MIGRATIONS: "false"
      LIFELY_RUN_SEEDERS: "false"
    depends_on:
      backend:
        condition: service_started
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    command: php artisan queue:work --queue=emails,leads,default --tries=3 --timeout=90

  scheduler:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: lifely-scheduler
    restart: unless-stopped
    volumes:
      - ./backend-laravel:/var/www/html
      - ./docker/backend/xdebug.ini:/usr/local/etc/php/conf.d/99-xdebug.ini:ro
      - lifely_backend_vendor:/var/www/html/vendor
      - lifely_backend_bootstrap_cache:/var/www/html/bootstrap/cache
    environment:
      APP_NAME: Lifely
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: "http://localhost:${BACKEND_PORT:-8000}"
      FRONTEND_URL: "http://localhost:${FRONTEND_PORT:-5173}"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: "${MYSQL_DATABASE:-lifely}"
      DB_USERNAME: root
      DB_PASSWORD: "${MYSQL_ROOT_PASSWORD:-secret}"
      SESSION_DRIVER: file
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_FROM_ADDRESS: "hello@lifely.local"
      MAIL_FROM_NAME: Lifely
      LIFELY_ACCESS_TOKEN_MINUTES: 15
      LIFELY_REFRESH_TOKEN_DAYS: 30
      LIFELY_RUN_MIGRATIONS: "false"
      LIFELY_RUN_SEEDERS: "false"
    depends_on:
      backend:
        condition: service_started
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    command: php artisan schedule:work

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    container_name: lifely-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - lifely_frontend_node_modules:/app/node_modules
    environment:
      VITE_API_BASE_URL: "http://localhost:${BACKEND_PORT:-8000}/api/v1"
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      - backend

volumes:
  lifely_mysql_data:
  lifely_redis_data:
  lifely_backend_vendor:
  lifely_backend_bootstrap_cache:
  lifely_frontend_node_modules:
