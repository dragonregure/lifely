  /references:
    get:
      tags: [References]
      summary: List references
      description: Requires `references.view`. Returns system references plus references owned by the current tenant.
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
        - { $ref: "#/components/parameters/Search" }
        - in: query
          name: sort
          schema: { type: string, enum: [reference, key, group, value, type, status, updated, updated_at, created_at] }
          description: Whitelisted sort key. Unknown values fall back to `group`.
        - { $ref: "#/components/parameters/Direction" }
        - in: query
          name: filter[group]
          schema: { type: string }
          description: Filter by reference group. Top-level `group` is also accepted.
        - in: query
          name: filter[type]
          schema: { type: string, enum: [string, int, float, double, bool, array, object, "null"] }
          description: Filter by value type. Top-level `type` is also accepted.
        - in: query
          name: filter[status]
          schema: { type: string, enum: [ACTIVE, INACTIVE] }
          description: Filter by status. Top-level `status` is also accepted.
        - in: query
          name: filter[scope]
          schema: { type: string, enum: [system, tenant] }
          description: Filter system references (`tenant_id` null) or current tenant references. Top-level `scope` is also accepted.
      responses:
        "200": { description: Paginated system and tenant-visible references. }
        "403": { description: Missing `references.view` permission. }
    post:
      tags: [References]
      summary: Create reference
      description: Requires `references.create`. System references require `references.manage_system`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReferenceStorePayload" }
      responses:
        "201": { description: Reference created. }
        "403": { description: Missing permission or cross-tenant reference write. }
        "422": { description: Validation failed or system reference write denied. }
  /references/types:
    get:
      tags: [References]
      summary: List reference value type options
      description: Requires `references.view`. Returns PHP value type options from the `reference_type` reference group.
      responses:
        "200":
          description: Reference value type options.
          content:
