openapi: 3.0.3
info:
  title: Lifely API
  version: 1.0.0
  description: API-first Laravel backend for the Lifely multi-tenant real estate CRM.
servers:
  - url: /api/v1
security:
  - BearerAuth: []
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum token
    TenantHeader:
      type: apiKey
      in: header
      name: X-Tenant-Id
  schemas:
    Tenant:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        created_at: { type: string, format: date-time, nullable: true }
    Contact:
      type: object
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        owner_id: { type: string, format: uuid, nullable: true }
        first_name: { type: string }
        last_name: { type: string }
        email: { type: string, format: email }
        phone: { type: string, nullable: true }
        status: { type: string, enum: [New, Qualified, Viewing, Negotiating, Closed, Dormant] }
        budget: { type: number, nullable: true }
        source: { type: string, nullable: true }
        last_contacted_at: { type: string, format: date-time, nullable: true }
    Listing:
      type: object
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        title: { type: string }
        address: { type: string }
        price: { type: number }
        status: { type: string, enum: [Available, Reserved, Under Contract, Sold] }
        bedrooms: { type: integer }
        bathrooms: { type: integer }
        property_type: { type: string, enum: [House, Condo, Townhome, Land] }
    PipelineDeal:
      type: object
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        contact_id: { type: string, format: uuid }
        listing_id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        stage: { type: string, enum: [New lead, Contacted, Viewing, Offer, Closing] }
        value: { type: number }
        next_task: { type: string, nullable: true }
        due_at: { type: string, format: date-time, nullable: true }
    EmailCampaign:
      type: object
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        user_id: { type: string, format: uuid, nullable: true }
        subject: { type: string }
        recipient_count: { type: integer }
        status: { type: string, enum: [Queued, Sent] }
    Permission:
      type: object
      properties:
        id: { type: integer }
        name: { type: string, example: roles.view }
        guard_name: { type: string, example: web }
        created_at: { type: string, format: date-time, nullable: true }
        updated_at: { type: string, format: date-time, nullable: true }
    Role:
      type: object
      properties:
        id: { type: integer }
        name: { type: string, example: Sales }
        guard_name: { type: string, example: web }
        permissions:
          type: array
          items: { $ref: "#/components/schemas/Permission" }
        created_at: { type: string, format: date-time, nullable: true }
        updated_at: { type: string, format: date-time, nullable: true }
    UserPermissions:
      type: object
      properties:
        user_id: { type: string, format: uuid }
        roles:
          type: array
          items: { type: string }
          example: [Office Admin]
        direct_permissions:
          type: array
          items: { type: string }
          example: [contacts.view]
        permissions:
          type: array
          items: { type: string }
          example: [roles.view, roles.create, users.assign_roles]
    Reference:
      type: object
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid, nullable: true }
        is_system: { type: boolean }
        group: { type: string, example: street_type }
        key: { type: string, example: ave }
        value: { type: string, nullable: true, example: Avenue }
        type: { type: string, example: string }
        meta: { type: object, nullable: true }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
        created_at: { type: string, format: date-time, nullable: true }
        updated_at: { type: string, format: date-time, nullable: true }
    RolePayload:
      type: object
      required: [name]
      properties:
        name: { type: string, example: Sales Manager }
        guard_name: { type: string, default: web }
        permissions:
          type: array
          items: { type: string }
          example: [contacts.view, contacts.create, pipeline.view]
    PermissionPayload:
      type: object
      required: [name]
      properties:
        name: { type: string, example: reports.export }
        guard_name: { type: string, default: web }
    UserRoleSyncPayload:
      type: object
      required: [roles]
      properties:
        roles:
          type: array
          items: { type: string }
          example: [Sales, Property Manager]
        guard_name: { type: string, default: web }
    UserPermissionSyncPayload:
      type: object
      required: [permissions]
      properties:
        permissions:
          type: array
          items: { type: string }
          example: [contacts.view, reports.view]
        guard_name: { type: string, default: web }
    ReferencePayload:
      type: object
      required: [group, key]
      properties:
        tenant_id:
          type: string
          format: uuid
          nullable: true
          description: Omit to create a tenant reference. Only users with `references.manage_system` can send null to create or convert a system reference.
        group: { type: string, example: street_type }
        key: { type: string, example: ave }
        value: { type: string, nullable: true, example: Avenue }
        type: { type: string, default: string, enum: [string, int, float, double, bool, array, object, "null"] }
        meta: { type: object, nullable: true }
        status: { type: string, enum: [ACTIVE, INACTIVE], default: ACTIVE }
paths:
  /health:
    get:
      security: []
      summary: Health check
      responses:
        "200": { description: Service is healthy. }
  /auth/register:
    post:
      security: []
      summary: Register an office admin and tenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant_name, name, email, password, password_confirmation]
              properties:
                tenant_name: { type: string }
                name: { type: string }
                email: { type: string, format: email }
                password: { type: string, format: password }
                password_confirmation: { type: string, format: password }
                device_name: { type: string }
      responses:
        "201": { description: "User, access token, and refresh token created." }
  /auth/login:
    post:
      security: []
      summary: Login and issue Sanctum access and refresh tokens
      requestBody:
        required: true
        content:
          application/json:
            examples:
              demo:
                summary: Demo login
                value:
                  email: maya@skyline.example
                  password: password
                  device_name: swagger-demo
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
                device_name: { type: string }
      responses:
        "200": { description: "User, access token, and refresh token." }
  /auth/refresh:
    post:
      security: []
      summary: Rotate refresh token and issue a new access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
                device_name: { type: string }
      responses:
        "200": { description: New access and refresh token pair. }
  /auth/me:
    get:
      summary: Current authenticated user
      responses:
        "200": { description: Current user profile and tenant. }
  /auth/logout:
    post:
      summary: Revoke the current access token
      responses:
        "200": { description: Current token revoked. }
  /auth/revoke-all:
    post:
      summary: Revoke all tokens for the current user
      responses:
        "200": { description: All user tokens revoked. }
  /auth/password:
    put:
      summary: Update password and revoke all tokens
      responses:
        "200": { description: Password updated. }
  /tenant:
    get:
      summary: Current tenant
      security:
        - BearerAuth: []
        - TenantHeader: []
      responses:
        "200": { description: Tenant profile. }
  /members:
    get:
      summary: Office members
      security:
        - BearerAuth: []
        - TenantHeader: []
      responses:
        "200": { description: Members for the current tenant. }
  /me/permissions:
    get:
      summary: Current authenticated user's roles and permissions
      description: Returns role names, direct permissions, and all effective permissions for SPA authorization hints. Backend authorization remains authoritative.
      responses:
        "200":
          description: Current user's effective access profile.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/UserPermissions" }
  /roles:
    get:
      summary: List roles
      description: Requires `roles.view`.
      responses:
        "200":
          description: Roles with assigned permissions.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Role" }
    post:
      summary: Create role
      description: Requires `roles.create`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RolePayload" }
            examples:
              salesManager:
                summary: Sales manager role
                value:
                  name: Sales Manager
                  guard_name: web
                  permissions: [contacts.view, contacts.create, pipeline.view]
      responses:
        "201": { description: Role created. }
        "403": { description: Missing `roles.create` permission. }
        "422": { description: Validation failed. }
  /roles/{role}:
    get:
      summary: Show role
      description: Requires `roles.view`.
      parameters:
        - in: path
          name: role
          required: true
          schema: { type: integer }
      responses:
        "200": { description: Role details. }
    put:
      summary: Update role
      description: Requires `roles.update`. Office Admin cannot be renamed.
      parameters:
        - in: path
          name: role
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RolePayload" }
      responses:
        "200": { description: Role updated. }
        "403": { description: Missing `roles.update` permission. }
        "422": { description: Validation or protected-role rule failed. }
    patch:
      summary: Partially update role
      description: Requires `roles.update`. Accepts the same fields as role update.
      parameters:
        - in: path
          name: role
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RolePayload" }
      responses:
        "200": { description: Role updated. }
        "403": { description: Missing `roles.update` permission. }
        "422": { description: Validation or protected-role rule failed. }
    delete:
      summary: Delete role
      description: Requires `roles.delete`. Office Admin cannot be deleted.
      parameters:
        - in: path
          name: role
          required: true
          schema: { type: integer }
      responses:
        "204": { description: Role deleted. }
        "403": { description: Missing `roles.delete` permission. }
        "422": { description: Protected role cannot be deleted. }
  /permissions:
    get:
      summary: List permissions
      description: Requires `permissions.view`.
      responses:
        "200":
          description: Permissions.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Permission" }
    post:
      summary: Create permission
      description: Requires `permissions.create`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PermissionPayload" }
            examples:
              exportReports:
                summary: Custom permission
                value:
                  name: reports.export
                  guard_name: web
      responses:
        "201": { description: Permission created. }
        "403": { description: Missing `permissions.create` permission. }
        "422": { description: Validation failed. }
  /permissions/{permission}:
    get:
      summary: Show permission
      description: Requires `permissions.view`.
      parameters:
        - in: path
          name: permission
          required: true
          schema: { type: integer }
      responses:
        "200": { description: Permission details. }
    put:
      summary: Update permission
      description: Requires `permissions.update`. Protected administrative permissions cannot be renamed.
      parameters:
        - in: path
          name: permission
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PermissionPayload" }
      responses:
        "200": { description: Permission updated. }
        "403": { description: Missing `permissions.update` permission. }
        "422": { description: Validation or protected-permission rule failed. }
    patch:
      summary: Partially update permission
      description: Requires `permissions.update`. Accepts the same fields as permission update.
      parameters:
        - in: path
          name: permission
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PermissionPayload" }
      responses:
        "200": { description: Permission updated. }
        "403": { description: Missing `permissions.update` permission. }
        "422": { description: Validation or protected-permission rule failed. }
    delete:
      summary: Delete permission
      description: Requires `permissions.delete`. Protected/admin-critical permissions cannot be deleted.
      parameters:
        - in: path
          name: permission
          required: true
          schema: { type: integer }
      responses:
        "204": { description: Permission deleted. }
        "403": { description: Missing `permissions.delete` permission. }
        "422": { description: Protected permission cannot be deleted. }
  /users/{user}/roles:
    put:
      summary: Sync roles to user
      description: Requires `users.assign_roles`. Prevents removing the last Office Admin.
      security:
        - BearerAuth: []
        - TenantHeader: []
      parameters:
        - in: path
          name: user
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserRoleSyncPayload" }
            examples:
              salesUser:
                summary: Assign Sales role
                value:
                  roles: [Sales]
                  guard_name: web
      responses:
        "200": { description: User roles synced. }
        "403": { description: Missing `users.assign_roles` permission. }
        "404": { description: User is outside current tenant or not found. }
        "422": { description: Validation failed or last Office Admin protection triggered. }
  /users/{user}/permissions:
    put:
      summary: Sync direct permissions to user
      description: Requires `users.assign_permissions`.
      security:
        - BearerAuth: []
        - TenantHeader: []
      parameters:
        - in: path
          name: user
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserPermissionSyncPayload" }
            examples:
              reportAccess:
                summary: Grant report access
                value:
                  permissions: [reports.view]
                  guard_name: web
      responses:
        "200": { description: User direct permissions synced. }
        "403": { description: Missing `users.assign_permissions` permission. }
        "404": { description: User is outside current tenant or not found. }
        "422": { description: Validation failed. }
  /dashboard:
    get:
      summary: Dashboard summary
      security:
        - BearerAuth: []
        - TenantHeader: []
      responses:
        "200": { description: Dashboard KPIs and pipeline reporting. }
  /contacts:
    get:
      summary: List contacts
      parameters:
        - in: query
          name: status
          schema: { type: string }
      responses:
        "200": { description: Tenant-scoped contacts. }
    post:
      summary: Create contact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [first_name, last_name, email]
              properties:
                owner_id: { type: string, format: uuid, nullable: true }
                first_name: { type: string }
                last_name: { type: string }
                email: { type: string, format: email }
                phone: { type: string }
                status: { type: string }
                budget: { type: number }
                source: { type: string }
      responses:
        "201": { description: Contact created. }
  /contacts/{contact}:
    get:
      summary: Show contact
      parameters:
        - in: path
          name: contact
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Contact details. }
    put:
      summary: Update contact
      parameters:
        - in: path
          name: contact
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Contact updated. }
  /listings:
    get:
      summary: List listings
      responses:
        "200": { description: Tenant-scoped listings. }
    post:
      summary: Create listing
      responses:
        "201": { description: Listing created. }
  /pipeline:
    get:
      summary: List pipeline deals
      responses:
        "200": { description: Tenant-scoped pipeline deals. }
    post:
      summary: Create pipeline deal
      responses:
        "201": { description: Deal created. }
  /pipeline/{pipeline}/stage:
    patch:
      summary: Move pipeline deal to a new stage
      parameters:
        - in: path
          name: pipeline
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Deal stage updated. }
  /references:
    get:
      summary: List references
      description: Requires `references.view`. Returns system references plus references owned by the current tenant.
      security:
        - BearerAuth: []
        - TenantHeader: []
      parameters:
        - in: query
          name: group
          schema: { type: string }
          example: street_type
        - in: query
          name: type
          schema: { type: string }
          example: string
        - in: query
          name: status
          schema: { type: string, enum: [ACTIVE, INACTIVE] }
      responses:
        "200": { description: System and tenant-visible references. }
        "403": { description: Missing `references.view` permission. }
    post:
      summary: Create reference
      description: "Requires `references.create`. Omitting `tenant_id` creates a tenant reference; only users with `references.manage_system` can send `tenant_id: null` to create a system reference."
      security:
        - BearerAuth: []
        - TenantHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReferencePayload" }
            examples:
              streetType:
                summary: Tenant street type
                value:
                  group: street_type
                  key: mews
                  value: Mews
              systemReference:
                summary: System reference
                value:
                  tenant_id: null
                  group: street_type
                  key: trl
                  value: Trail
      responses:
        "201": { description: Reference created. }
        "403": { description: Missing `references.create` permission or cross-tenant reference write. }
        "422": { description: Validation failed or user without `references.manage_system` attempted a system reference write. }
  /references/{reference}:
    get:
      summary: Show reference
      description: Requires `references.view`.
      parameters:
        - in: path
          name: reference
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Reference details. }
        "404": { description: Reference is outside current tenant scope or not found. }
    put:
      summary: Update reference
      description: "Requires `references.update`. Existing system references and `tenant_id: null` updates require `references.manage_system`."
      parameters:
        - in: path
          name: reference
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReferencePayload" }
      responses:
        "200": { description: Reference updated. }
        "403": { description: Missing `references.update` permission or cross-tenant reference write. }
        "404": { description: Reference is outside current tenant scope or not found. }
        "422": { description: Validation failed or user without `references.manage_system` attempted a system reference write. }
    patch:
      summary: Partially update reference
      description: "Requires `references.update`. Accepts the same fields as reference update. Existing system references and `tenant_id: null` updates require `references.manage_system`."
      parameters:
        - in: path
          name: reference
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReferencePayload" }
      responses:
        "200": { description: Reference updated. }
        "403": { description: Missing `references.update` permission or cross-tenant reference write. }
        "404": { description: Reference is outside current tenant scope or not found. }
        "422": { description: Validation failed or user without `references.manage_system` attempted a system reference write. }
    delete:
      summary: Delete reference
      description: Requires `references.delete`. Deleting system references requires `references.manage_system`.
      parameters:
        - in: path
          name: reference
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Reference deleted. }
        "403": { description: Missing `references.delete` permission. }
        "404": { description: Reference is outside current tenant scope or not found. }
        "422": { description: Protected reference cannot be deleted. }
  /activity-logs:
    get:
      summary: List activity logs
      responses:
        "200": { description: Tenant-scoped audit trail. }
  /email-campaigns:
    get:
      summary: List email campaigns
      responses:
        "200": { description: Tenant-scoped campaigns. }
  /bulk-emails:
    post:
      summary: Queue bulk email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contact_ids, subject, body]
              properties:
                user_id: { type: string, format: uuid, nullable: true }
                contact_ids:
                  type: array
                  items: { type: string, format: uuid }
                subject: { type: string }
                body: { type: string }
      responses:
        "202": { description: Campaign accepted and queued. }
