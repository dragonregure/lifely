openapi: 3.0.3
info:
  title: Lifely API
  version: 1.0.0
  description: >
    API-first Laravel backend for the Lifely multi-tenant real estate CRM.
    Protected endpoints use Sanctum bearer tokens. Tenant context is resolved from
    the authenticated user by default; `X-Tenant-Id` and `tenant_id` are still
    accepted by the backend as compatibility overrides, but they are not an
    authentication mechanism and are not required for normal SPA/API clients.
servers:
  - url: /api/v1
tags:
  - name: System
    description: Health and operational endpoints.
  - name: Auth
    description: Registration, login, token rotation, and account session actions.
  - name: Tenant
    description: Current office tenant and member context.
  - name: Access Control
    description: Roles, permissions, and user access assignment.
  - name: Dashboard
    description: CRM summary and reporting data.
  - name: Contacts
    description: Tenant-scoped CRM contacts and leads.
  - name: Listings
    description: Tenant-scoped property inventory.
  - name: Pipeline
    description: Tenant-scoped deal pipeline.
  - name: References
    description: System and tenant reference values.
  - name: Activity Logs
    description: Tenant-scoped audit activity.
  - name: Email Campaigns
    description: Bulk email campaign queueing and history.
security:
  - BearerAuth: []
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum token
  parameters:
    Page:
      in: query
      name: page
      schema: { type: integer, minimum: 1, default: 1 }
      description: Page number for server-side pagination.
    PerPage:
      in: query
      name: per_page
      schema: { type: integer, minimum: 1, maximum: 100, default: 15 }
      description: Records per page. Values above 100 are capped at 100.
    Search:
      in: query
      name: search
      schema: { type: string }
      description: Server-side search term. Empty values are ignored.
    Direction:
      in: query
      name: direction
      schema: { type: string, enum: [asc, desc], default: desc }
      description: Sort direction. Invalid values fall back to `desc`.
    ContactId:
      in: path
      name: contact
      required: true
      schema: { type: string, format: uuid }
      description: Tenant-scoped contact UUID.
    ListingId:
      in: path
      name: listing
      required: true
      schema: { type: string, format: uuid }
      description: Tenant-scoped listing UUID.
    PipelineId:
      in: path
      name: pipeline
      required: true
      schema: { type: string, format: uuid }
      description: Tenant-scoped pipeline deal UUID.
    ReferenceId:
      in: path
      name: reference
      required: true
      schema: { type: string, format: uuid }
      description: System or tenant-visible reference UUID.
    RoleId:
      in: path
      name: role
      required: true
      schema: { type: integer }
      description: Spatie role ID.
    PermissionId:
      in: path
      name: permission
      required: true
      schema: { type: integer }
      description: Spatie permission ID.
    UserId:
      in: path
      name: user
      required: true
      schema: { type: string, format: uuid }
      description: User UUID. The user must belong to the current tenant context.
  schemas:
    ErrorResponse:
      type: object
      properties:
        message: { type: string }
        errors:
          type: object
          nullable: true
          additionalProperties:
            type: array
            items: { type: string }
    MessageResponse:
      type: object
      properties:
        message: { type: string }
    PaginationMeta:
      type: object
      properties:
        current_page: { type: integer }
        from: { type: integer, nullable: true }
        last_page: { type: integer }
        per_page: { type: integer }
        to: { type: integer, nullable: true }
        total: { type: integer }
    Tenant:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: Skyline Realty Office }
        created_at: { type: string, format: date-time, nullable: true }
    AuthUser:
      type: object
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        role: { type: string, example: Office Admin }
        roles:
          type: array
          items: { type: string }
        permissions:
          type: array
          items: { type: string }
        name: { type: string, example: Maya Hart }
        email: { type: string, format: email, example: maya@skyline.example }
        tenant: { $ref: "#/components/schemas/Tenant" }
    AuthTokenPayload:
      type: object
      properties:
        token_type: { type: string, example: Bearer }
        access_token: { type: string }
        access_expires_at: { type: string, format: date-time, nullable: true }
        refresh_token: { type: string }
        refresh_expires_at: { type: string, format: date-time, nullable: true }
        user: { $ref: "#/components/schemas/AuthUser" }
    Member:
      type: object
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        role: { type: string, example: Sales }
        roles:
          type: array
          items: { type: string }
        direct_permissions:
          type: array
          items: { type: string }
        name: { type: string }
        email: { type: string, format: email }
        created_at: { type: string, format: date-time, nullable: true }
    Permission:
      type: object
      properties:
        id: { type: integer }
        name: { type: string, example: roles.view }
        guard_name: { type: string, example: web }
        created_at: { type: string, format: date-time, nullable: true }
        updated_at: { type: string, format: date-time, nullable: true }
    Role:
      type: object
      properties:
        id: { type: integer }
        name: { type: string, example: Sales }
        guard_name: { type: string, example: web }
        permissions:
          type: array
          items: { $ref: "#/components/schemas/Permission" }
        created_at: { type: string, format: date-time, nullable: true }
        updated_at: { type: string, format: date-time, nullable: true }
    UserPermissions:
      type: object
      properties:
        user_id: { type: string, format: uuid }
        roles:
          type: array
          items: { type: string }
          example: [Office Admin]
        direct_permissions:
          type: array
          items: { type: string }
          example: [contacts.view]
        permissions:
          type: array
          items: { type: string }
          example: [roles.view, roles.create, users.assign_roles]
    Contact:
      type: object
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        owner_id: { type: string, format: uuid, nullable: true }
        first_name: { type: string }
        last_name: { type: string }
        email: { type: string, format: email }
        phone: { type: string, nullable: true }
        status: { type: string, enum: [New, Qualified, Viewing, Negotiating, Closed, Dormant] }
        budget: { type: number, nullable: true }
        source: { type: string, nullable: true }
        last_contacted_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time, nullable: true }
    Listing:
      type: object
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        title: { type: string }
        address: { type: string }
        price: { type: number }
        status: { type: string, enum: [Available, Reserved, Under Contract, Sold] }
        bedrooms: { type: integer, nullable: true }
        bathrooms: { type: integer, nullable: true }
        property_type: { type: string, enum: [House, Condo, Townhome, Land] }
        created_at: { type: string, format: date-time, nullable: true }
    PipelineDeal:
      type: object
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        contact_id: { type: string, format: uuid }
        listing_id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        stage: { type: string, enum: [New lead, Contacted, Viewing, Offer, Closing] }
        value: { type: number }
        next_task: { type: string, nullable: true }
        due_at: { type: string, format: date-time, nullable: true }
        contact: { $ref: "#/components/schemas/Contact" }
        listing: { $ref: "#/components/schemas/Listing" }
        created_at: { type: string, format: date-time, nullable: true }
    ActivityLog:
      type: object
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        user_id: { type: string, format: uuid, nullable: true }
        action_type: { type: string, example: contact.created }
        description: { type: string }
        properties:
          type: object
          nullable: true
          description: Structured activity metadata. Update activities include a `changes` object keyed by updated field.
          additionalProperties: true
          example:
            subject_type: contact
            subject_id: 0197066f-2aa2-73f8-93d1-56a73ad14220
            changes:
              status:
                old: New
                new: Qualified
        created_at: { type: string, format: date-time, nullable: true }
    EmailCampaign:
      type: object
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        user_id: { type: string, format: uuid, nullable: true }
        subject: { type: string }
        recipient_count: { type: integer }
        status: { type: string, enum: [Queued, Sent] }
        created_at: { type: string, format: date-time, nullable: true }
    Reference:
      type: object
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid, nullable: true }
        is_system: { type: boolean }
        group: { type: string, example: street_type }
        key: { type: string, example: ave }
        value:
          nullable: true
          description: Value cast according to `type`.
          oneOf:
            - type: string
            - type: integer
            - type: number
            - type: boolean
            - type: array
              items: {}
            - type: object
        type: { type: string, enum: [string, int, float, double, bool, array, object, "null"] }
        meta: { type: object, nullable: true }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
        created_at: { type: string, format: date-time, nullable: true }
        updated_at: { type: string, format: date-time, nullable: true }
    ReferenceOption:
      type: object
      properties:
        label: { type: string, example: Street Type }
        value: { type: string, example: street_type }
    DashboardSummary:
      type: object
      properties:
        new_leads: { type: integer }
        pending_tasks: { type: integer }
        pipeline_value: { type: number }
        win_rate: { type: number }
        pipeline_performance:
          type: array
          items:
            type: object
            properties:
              label: { type: string, example: Jan }
              value: { type: number }
        lead_health:
          type: array
          items:
            type: object
            properties:
              label: { type: string, example: Qualified }
              value: { type: integer }
    RegisterPayload:
      type: object
      required: [tenant_name, name, email, password, password_confirmation]
      properties:
        tenant_name: { type: string, maxLength: 180, example: Skyline Realty Office }
        name: { type: string, maxLength: 120, example: Maya Hart }
        email: { type: string, format: email, maxLength: 255, example: maya@skyline.example }
        password:
          type: string
          format: password
          minLength: 8
          description: Must contain mixed case letters and numbers.
        password_confirmation: { type: string, format: password }
        device_name: { type: string, nullable: true, maxLength: 120, example: swagger-demo }
    LoginPayload:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, example: maya@skyline.example }
        password: { type: string, format: password, example: password }
        device_name: { type: string, nullable: true, maxLength: 120, example: swagger-demo }
    RefreshTokenPayload:
      type: object
      required: [refresh_token]
      properties:
        refresh_token: { type: string }
        device_name: { type: string, nullable: true, maxLength: 120, example: lifely-frontend }
    LogoutPayload:
      type: object
      properties:
        refresh_token: { type: string, nullable: true }
    UpdatePasswordPayload:
      type: object
      required: [current_password, password, password_confirmation]
      properties:
        current_password: { type: string, format: password }
        password:
          type: string
          format: password
          minLength: 12
          description: Must contain mixed case letters and numbers.
        password_confirmation: { type: string, format: password }
    RoleStorePayload:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 125, example: Sales Manager }
        guard_name: { type: string, maxLength: 125, default: web }
        permissions:
          type: array
          items: { type: string }
          example: [contacts.view, contacts.create, pipeline.view]
    RoleUpdatePayload:
      type: object
      properties:
        name: { type: string, maxLength: 125, example: Sales Manager }
        guard_name: { type: string, maxLength: 125, default: web }
        permissions:
          type: array
          items: { type: string }
    PermissionStorePayload:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 125, example: reports.export }
        guard_name: { type: string, maxLength: 125, default: web }
    PermissionUpdatePayload:
      type: object
      properties:
        name: { type: string, maxLength: 125, example: reports.export }
        guard_name: { type: string, maxLength: 125, default: web }
    UserRoleSyncPayload:
      type: object
      required: [roles]
      properties:
        roles:
          type: array
          items: { type: string }
          example: [Sales, Property Manager]
        guard_name: { type: string, maxLength: 125, default: web }
    UserPermissionSyncPayload:
      type: object
      required: [permissions]
      properties:
        permissions:
          type: array
          items: { type: string }
          example: [contacts.view, reports.view]
        guard_name: { type: string, maxLength: 125, default: web }
    ContactStorePayload:
      type: object
      required: [first_name, last_name, email]
      properties:
        owner_id: { type: string, format: uuid, nullable: true }
        first_name: { type: string, maxLength: 120 }
        last_name: { type: string, maxLength: 120 }
        email: { type: string, format: email, maxLength: 255 }
        phone: { type: string, nullable: true, maxLength: 40 }
        status: { type: string, nullable: true, enum: [New, Qualified, Viewing, Negotiating, Closed, Dormant] }
        budget: { type: number, nullable: true, minimum: 0 }
        source: { type: string, nullable: true, maxLength: 120 }
        last_contacted_at: { type: string, format: date-time, nullable: true }
    ContactUpdatePayload:
      type: object
      properties:
        owner_id: { type: string, format: uuid, nullable: true }
        first_name: { type: string, maxLength: 120 }
        last_name: { type: string, maxLength: 120 }
        email: { type: string, format: email, maxLength: 255 }
        phone: { type: string, nullable: true, maxLength: 40 }
        status: { type: string, enum: [New, Qualified, Viewing, Negotiating, Closed, Dormant] }
        budget: { type: number, nullable: true, minimum: 0 }
        source: { type: string, nullable: true, maxLength: 120 }
        last_contacted_at: { type: string, format: date-time, nullable: true }
    ListingStorePayload:
      type: object
      required: [title, address, price]
      properties:
        title: { type: string, maxLength: 180 }
        address: { type: string }
        price: { type: number, minimum: 0 }
        status: { type: string, nullable: true, enum: [Available, Reserved, Under Contract, Sold] }
        bedrooms: { type: integer, nullable: true, minimum: 0, maximum: 20 }
        bathrooms: { type: integer, nullable: true, minimum: 0, maximum: 20 }
        property_type: { type: string, nullable: true, enum: [House, Condo, Townhome, Land] }
    PipelineStorePayload:
      type: object
      required: [contact_id, listing_id, user_id, value]
      properties:
        contact_id: { type: string, format: uuid }
        listing_id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        stage: { type: string, nullable: true, enum: [New lead, Contacted, Viewing, Offer, Closing] }
        value: { type: number, minimum: 0 }
        next_task: { type: string, nullable: true, maxLength: 255 }
        due_at: { type: string, format: date-time, nullable: true }
    PipelineStagePayload:
      type: object
      required: [stage]
      properties:
        stage: { type: string, enum: [New lead, Contacted, Viewing, Offer, Closing] }
    ReferenceStorePayload:
      type: object
      required: [group, key]
      properties:
        tenant_id:
          type: string
          format: uuid
          nullable: true
          description: Omit to create a tenant reference. Send null only with `references.manage_system` to create a system reference.
        group: { type: string, maxLength: 120, example: street_type }
        key: { type: string, maxLength: 120, example: ave }
        value: { type: string, nullable: true, maxLength: 255, example: Avenue }
        type: { type: string, enum: [string, int, float, double, bool, array, object, "null"], default: string }
        meta: { type: object, nullable: true }
        status: { type: string, enum: [ACTIVE, INACTIVE], default: ACTIVE }
    ReferenceUpdatePayload:
      type: object
      properties:
        tenant_id:
          type: string
          format: uuid
          nullable: true
          description: Send null only with `references.manage_system` to convert to a system reference.
        group: { type: string, maxLength: 120 }
        key: { type: string, maxLength: 120 }
        value: { type: string, nullable: true, maxLength: 255 }
        type: { type: string, enum: [string, int, float, double, bool, array, object, "null"] }
        meta: { type: object, nullable: true }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
    BulkEmailPayload:
      type: object
      required: [contact_ids, subject, body]
      properties:
        user_id: { type: string, format: uuid, nullable: true }
        contact_ids:
          type: array
          minItems: 1
          items: { type: string, format: uuid }
        subject: { type: string, maxLength: 180 }
        body: { type: string, maxLength: 10000 }
paths:
  /health:
    get:
      tags: [System]
      security: []
      summary: Health check
      responses:
        "200":
          description: Service is healthy.
  /auth/register:
    post:
      tags: [Auth]
      security: []
      summary: Register an office admin and tenant
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterPayload" }
      responses:
        "201":
          description: User, access token, and refresh token created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/AuthTokenPayload" }
        "422": { description: Validation failed. }
  /auth/login:
    post:
      tags: [Auth]
      security: []
      summary: Login and issue Sanctum access and refresh tokens
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginPayload" }
            examples:
              demo:
                summary: Demo login
                value:
                  email: maya@skyline.example
                  password: password
                  device_name: swagger-demo
      responses:
        "200":
          description: User, access token, and refresh token.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/AuthTokenPayload" }
        "401": { description: Invalid credentials. }
        "422": { description: Validation failed. }
  /auth/refresh:
    post:
      tags: [Auth]
      security: []
      summary: Rotate refresh token and issue a new access token
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshTokenPayload" }
      responses:
        "200": { description: New access and refresh token pair. }
        "401": { description: Invalid refresh token. }
        "422": { description: Validation failed. }
  /auth/me:
    get:
      tags: [Auth]
      summary: Current authenticated user
      responses:
        "200": { description: Current user profile and tenant. }
        "401": { description: Unauthenticated. }
  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoke the current access token
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LogoutPayload" }
      responses:
        "200": { description: Current access token revoked. }
        "401": { description: Unauthenticated. }
  /auth/revoke-all:
    post:
      tags: [Auth]
      summary: Revoke all tokens for the current user
      responses:
        "200": { description: All user tokens revoked. }
        "401": { description: Unauthenticated. }
  /auth/password:
    put:
      tags: [Auth]
      summary: Update password and revoke all tokens
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdatePasswordPayload" }
      responses:
        "200": { description: Password updated. User must sign in again. }
        "422": { description: Validation failed or current password is incorrect. }
  /tenant:
    get:
      tags: [Tenant]
      summary: Current tenant
      description: Requires `tenant.view`.
      responses:
        "200":
          description: Tenant profile.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Tenant" }
        "403": { description: Missing `tenant.view` permission. }
        "404": { description: Tenant not found. }
  /members:
    get:
      tags: [Tenant]
      summary: Office members
      description: Requires `users.view`.
      responses:
        "200":
          description: Members for the current tenant.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Member" }
        "403": { description: Missing `users.view` permission. }
  /me/permissions:
    get:
      tags: [Access Control]
      summary: Current authenticated user's roles and permissions
      description: Returns role names, direct permissions, and all effective permissions for SPA authorization hints. Backend authorization remains authoritative.
      responses:
        "200":
          description: Current user's effective access profile.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/UserPermissions" }
  /roles:
    get:
      tags: [Access Control]
      summary: List roles
      description: Requires `roles.view`.
      responses:
        "200":
          description: Roles with assigned permissions.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Role" }
        "403": { description: Missing `roles.view` permission. }
    post:
      tags: [Access Control]
      summary: Create role
      description: Requires `roles.create`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoleStorePayload" }
      responses:
        "201": { description: Role created. }
        "403": { description: Missing `roles.create` permission. }
        "422": { description: Validation failed. }
  /roles/{role}:
    get:
      tags: [Access Control]
      summary: Show role
      description: Requires `roles.view`.
      parameters:
        - { $ref: "#/components/parameters/RoleId" }
      responses:
        "200": { description: Role details. }
        "403": { description: Missing `roles.view` permission. }
        "404": { description: Role not found. }
    put:
      tags: [Access Control]
      summary: Update role
      description: Requires `roles.update`. Protected roles such as Office Admin cannot be renamed or deleted by unsafe operations.
      parameters:
        - { $ref: "#/components/parameters/RoleId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoleUpdatePayload" }
      responses:
        "200": { description: Role updated. }
        "403": { description: Missing `roles.update` permission. }
        "422": { description: Validation or protected-role rule failed. }
    patch:
      tags: [Access Control]
      summary: Partially update role
      description: Requires `roles.update`. Accepts the same fields as role update.
      parameters:
        - { $ref: "#/components/parameters/RoleId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoleUpdatePayload" }
      responses:
        "200": { description: Role updated. }
        "403": { description: Missing `roles.update` permission. }
        "422": { description: Validation or protected-role rule failed. }
    delete:
      tags: [Access Control]
      summary: Delete role
