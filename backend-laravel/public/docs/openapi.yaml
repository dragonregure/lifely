  /references/groups:
    get:
      tags: [References]
      summary: List reference group options
      description: Requires `references.view`. Returns reference group filter options independent from the current paginated table result.
      responses:
        "200":
          description: Reference group options for filters.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ReferenceOption" }
        "403": { description: Missing `references.view` permission. }
  /references/{reference}:
    get:
      tags: [References]
      summary: Show reference
      description: Requires `references.view`.
      parameters:
        - { $ref: "#/components/parameters/ReferenceId" }
      responses:
        "200": { description: Reference details. }
        "403": { description: Missing `references.view` permission. }
        "404": { description: Reference is outside current tenant scope or not found. }
    put:
      tags: [References]
      summary: Update reference
      description: "Requires `references.update`. Existing system references and `tenant_id: null` updates require `references.manage_system`."
      parameters:
        - { $ref: "#/components/parameters/ReferenceId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReferenceUpdatePayload" }
      responses:
        "200": { description: Reference updated. }
        "403": { description: Missing permission or cross-tenant reference write. }
        "404": { description: Reference is outside current tenant scope or not found. }
        "422": { description: Validation failed or system reference write denied. }
    patch:
      tags: [References]
      summary: Partially update reference
      description: Requires `references.update`. Accepts the same fields as reference update.
      parameters:
        - { $ref: "#/components/parameters/ReferenceId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReferenceUpdatePayload" }
      responses:
        "200": { description: Reference updated. }
        "403": { description: Missing permission or cross-tenant reference write. }
        "404": { description: Reference is outside current tenant scope or not found. }
        "422": { description: Validation failed or system reference write denied. }
    delete:
      tags: [References]
      summary: Delete reference
      description: Requires `references.delete`. Deleting system references requires `references.manage_system`.
      parameters:
        - { $ref: "#/components/parameters/ReferenceId" }
      responses:
        "204": { description: Reference deleted. }
        "403": { description: Missing `references.delete` permission. }
        "404": { description: Reference is outside current tenant scope or not found. }
        "422": { description: Protected reference cannot be deleted. }
